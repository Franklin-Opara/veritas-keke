<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Veritas Keke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-body">

<!-- HEADER -->
<header class="dashboard-header">
    <div class="dashboard-header-inner">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-bus"></i>
            </div>
            <div>
                <h1 class="logo-title">Veritas Keke</h1>
                <p class="logo-sub">Rider Portal</p>
            </div>
        </div>
        <div class="header-user">
            <div class="user-info">
                <p class="user-name" th:text="${rider.user.firstName + ' ' + rider.user.lastName}"></p>
                <p class="user-sub" th:text="${rider.plateNumber}"></p>
            </div>
            <a href="/logout" class="icon-btn">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </div>
</header>

<div class="dashboard-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a th:href="@{/rider/dashboard}" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/rider/requests}" class="nav-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Ride Requests</span>
                <span class="nav-badge" th:if="${pendingRequests > 0}" th:text="${pendingRequests}"></span>
            </a>
            <a th:href="@{/rider/profile}" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
        <div style="max-width: 800px; margin: 0 auto;">

            <div class="mb-8">
                <h2 class="page-title">My Profile</h2>
                <p class="page-sub">Manage your rider account information</p>
            </div>

            <div class="auth-card">

                <!-- PROFILE HEADER -->
                <div class="profile-header">
                    <img th:src="${#strings.isEmpty(rider.profilePhoto) ? '/images/defaultProfile.png' : rider.profilePhoto}"
                         alt="Profile" class="profile-avatar">
                    <div>
                        <h3 class="profile-name" th:text="${rider.user.firstName + ' ' + rider.user.lastName}"></h3>
                        <p class="profile-role">Rider</p>
                    </div>
                </div>

                <!-- PROFILE INFO -->
                <div class="form-grid-2">
                    <div class="info-box">
                        <div class="info-box-label"><i class="fas fa-user"></i> Full Name</div>
                        <p class="info-box-value" th:text="${rider.user.firstName + ' ' + rider.user.lastName}"></p>
                    </div>
                    <div class="info-box">
                        <div class="info-box-label"><i class="fas fa-bus"></i>Plate Number</div>
                        <p class="info-box-value" th:text="${rider.plateNumber}"></p>
                    </div>
                    <div class="info-box">
                        <div class="info-box-label"><i class="fas fa-envelope"></i> Email Address</div>
                        <p class="info-box-value" th:text="${rider.user.email}"></p>
                    </div>
                    <div class="info-box">
                        <div class="info-box-label"><i class="fas fa-phone"></i> Phone Number</div>
                        <p class="info-box-value" th:text="${rider.phoneNumber}"></p>
                    </div>
                    <div class="info-box" style="grid-column: span 2;">
                        <div class="info-box-label"><i class="fas fa-credit-card"></i> Bank Details</div>
                        <p style="font-size:13px; color:#6B7280; margin:0;" th:text="${rider.bankName}"></p>
                        <p class="info-box-value" th:text="${rider.accountNumber}"></p>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
    var notificationSound = new Audio('/sounds/newRequest.mp3');

    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);
    stompClient.connect({}, function() {
        stompClient.subscribe('/topic/ride-requests', function() {
            notificationSound.play();

            var badge = document.querySelector('.nav-badge');
            if (badge) {
                badge.style.display = 'inline';
                badge.textContent = parseInt(badge.textContent || '0') + 1;
            } else {
                var requestLink = document.querySelector('a[href="/rider/requests"]');
                var newBadge = document.createElement('span');
                newBadge.className = 'nav-badge';
                newBadge.textContent = '1';
                requestLink.appendChild(newBadge);
            }
        });
    });

    function submitToggle() {
        document.getElementById('toggle-form').submit();
    }
</script>


</body>
</html>
