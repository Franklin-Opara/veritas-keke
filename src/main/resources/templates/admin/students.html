<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Veritas Keke</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-body">

<!-- HEADER -->
<header class="dashboard-header">
    <div class="dashboard-header-inner">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-bus"></i></div>
            <div>
                <h1 class="logo-title">Veritas Keke</h1>
                <p class="logo-sub">Admin Portal</p>
            </div>
        </div>
        <div class="header-user">
            <div class="user-info">
                <p class="user-name">Administrator</p>
                <p class="user-sub">System Admin</p>
            </div>
            <a href="/logout" class="icon-btn"><i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>
</header>

<div class="dashboard-wrapper">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}" class="nav-item">
                <i class="fas fa-home"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/admin/students}" class="nav-item active">
                <i class="fas fa-users"></i><span>Students</span>
            </a>
            <a th:href="@{/admin/riders}" class="nav-item">
                <i class="fas fa-car"></i><span>Riders</span>
            </a>
        </nav>
    </aside>

    <main class="dashboard-main">

        <div class="mb-8">
            <h2 class="page-title">Students Management</h2>
            <p class="page-sub">View and manage all registered students</p>
        </div>

        <!-- SEARCH -->
        <div class="search-bar">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" class="form-input" style="padding-left: 40px;"
                   placeholder="Search by name, student ID, or email..." onkeyup="searchStudents()">
        </div>

        <!-- STATS SUMMARY -->
        <div class="list-summary">
            <span>Total Students: <strong style="color:#1A6B3C;" th:text="${totalStudents}">0</strong></span>

        </div>

        <!-- STUDENTS LIST -->
        <div id="students-list">

            <!-- STUDENT CARD -->
            <div th:each="student : ${students}" class="list-card"
                 th:attr="data-name=${#strings.toLowerCase(student.user.firstName + ' ' + student.user.lastName)},
              data-id=${#strings.toLowerCase(student.matricNumber)},
              data-email=${#strings.toLowerCase(student.user.email)}">
                <div class="list-card-inner">
                    <img th:src="${#strings.isEmpty(student.profilePhoto) ? '/images/defaultProfile.png' : student.profilePhoto}"
                         alt="Student" class="list-avatar">
                    <div class="list-info">
                        <div class="list-info-header">
                            <div>
                                <h3 class="list-name" th:text="${student.user.firstName + ' ' + student.user.lastName}">Name</h3>
                                <div class="list-sub"><i class="fas fa-id-card"></i> <span th:text="${student.matricNumber}">Matric</span></div>
                            </div>
                            <form th:action="@{/admin/delete-student}" method="post"
                                  onsubmit="return confirmDeleteForm(this)">
                                <input type="hidden" name="studentId" th:value="${student.id}">
                                <button type="submit" class="btn-delete">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </form>
                        </div>
                        <div class="form-grid-2" style="margin-top:12px;">
                            <div>
                                <div class="list-detail"><i class="fas fa-envelope"></i> <span th:text="${student.user.email}">Email</span></div>
                                <div class="list-detail"><i class="fas fa-phone"></i> <span th:text="${student.phoneNumber}">Phone</span></div>
                            </div>
                            <div class="form-grid-2">
                                <div class="mini-stat">
                                    <p class="mini-stat-label">Total Rides</p>
                                    <p class="mini-stat-value" th:text="${student.totalRides}">0</p>
                                </div>
                                <div class="mini-stat">
                                    <p class="mini-stat-label">Joined</p>
                                    <p class="mini-stat-value" th:text="${#temporals.format(student.user.createdAt, 'MMM yyyy')}">Jan 2023</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div id="no-results" style="display:none; padding:48px;" class="auth-card text-center">
            <p class="page-sub">No students found matching your search</p>
        </div>

    </main>
</div>


<script>
    function searchStudents() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const cards = document.querySelectorAll('.list-card');
        let visible = 0;

        cards.forEach(card => {
            const name = card.getAttribute('data-name');
            const id = card.getAttribute('data-id');
            const email = card.getAttribute('data-email');
            if (name.includes(query) || id.includes(query) || email.includes(query)) {
                card.style.display = 'block';
                visible++;
            } else {
                card.style.display = 'none';
            }
        });

        document.getElementById('showing-count').textContent = 'Showing: ' + visible;
        document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
    }

    function confirmDeleteForm(form) {
        return confirm('Are you sure you want to delete this student?');
    }
</script>

</body>
</html>
